# Defaults. Production overrides live in values-prod.yaml.
replicaCount: 2

image:
  repository: ghcr.io/tesserix/beautyandcruor
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 80
  # The unprivileged nginx image binds 8080, which is what lets the pod run
  # non-root without NET_BIND_SERVICE.
  targetPort: 8080

ingress:
  enabled: true
  className: kong
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # Two NAMED SANs, never a wildcard. The CAA records restrict issuewild to
  # pki.goog and globalsign.com, so a wildcard request fails until
  # `0 issuewild "letsencrypt.org"` is added at Cloudflare. Named SANs need no
  # DNS change. See docs/DECISIONS.md D6.
  tlsSecretName: beautyandcruor-tls
  hosts:
    - host: beautyandcruor.com
    - host: www.beautyandcruor.com

# Serving static files from memory-mapped disk: tiny and predictable.
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 32Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1
