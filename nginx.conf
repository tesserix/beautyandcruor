# Serves the Next.js static export. Mirrors the old WordPress URL shape exactly:
# every page is a directory with a trailing slash.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Writable paths, so the container can run read-only and non-root.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml application/rss+xml;
  # AVIF, WebP, JPEG and PNG are already compressed — gzipping them wastes CPU.

  # First line of defence in front of the enquiry sidecar. The service keeps
  # its own per-address ceiling as well — this one is about protecting the pod
  # from volume, that one is about what a person plausibly sends.
  limit_req_zone $binary_remote_addr zone=enquiry:1m rate=6r/m;
  limit_req_status 429;

  map $sent_http_content_type $cache_control {
    default                           "public, max-age=0, must-revalidate";
    ~image/                           "public, max-age=31536000, immutable";
    ~font/                            "public, max-age=31536000, immutable";
    "application/javascript"          "public, max-age=31536000, immutable";
    "text/css"                        "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;

    # --- the enquiry sidecar -----------------------------------------------
    # Same origin as the site, so the browser needs no CORS and the service
    # needs no public address: it listens on loopback inside this pod, and
    # nothing outside can reach it.
    location = /api/enquiry {
      limit_req zone=enquiry burst=3 nodelay;

      proxy_pass http://127.0.0.1:8081/enquiry;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # The service rate-limits per sender, so it needs to know who that is.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      client_max_body_size 32k;
      proxy_read_timeout 20s;
      # A form post is never cacheable, and the map above would mark it
      # must-revalidate rather than no-store.
      add_header Cache-Control "no-store" always;
    }

    # Hashed build assets never change under the same name.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # --- gone, not missing -------------------------------------------------
    # Empty pages on the old site, plus the Curly demo Portfolio CPT (16 items
    # that referenced only logo and chrome, no work of their own). 410 tells
    # search engines the removal is permanent; they de-index faster than a 404.
    location = /paritivity/            { return 410; }
    location = /location-contact-us/   { return 410; }
    location = /main-home/             { return 410; }
    location ^~ /portfolio-item/       { return 410; }
    location ^~ /portfolio-category/   { return 410; }
    location ^~ /portfolio-tag/        { return 410; }
    location ^~ /testimonials-category/ { return 410; }

    # /beauty-cruor/ was never a separate page — it is the homepage's own slug.
    location = /beauty-cruor/ { return 301 /; }


    # --- old post permalinks ------------------------------------------------
    # WordPress used root-level %postname% permalinks. The rebuild nests posts
    # under /blogs/ for a cleaner namespace, so the originals redirect rather
    # than 404 — they carry whatever link equity the posts have. Generated
    # from src/content/posts; regenerate if a slug changes.
    location = /3d-printing-the-revolutionary-technology-shaping-art-film-and-medicine/ { return 301 /blogs/3d-printing-the-revolutionary-technology-shaping-art-film-and-medicine/; }
    location = /bridging-the-gap-sfx-and-makeup-prosthetics-in-the-indian-film-industry/ { return 301 /blogs/bridging-the-gap-sfx-and-makeup-prosthetics-in-the-indian-film-industry/; }

    # Category archives are not rebuilt; the journal index is the nearest
    # equivalent, so send readers there instead of a dead end.
    location ^~ /category/ { return 301 /blogs/; }
    location ^~ /tag/      { return 301 /blogs/; }
    location ^~ /author/   { return 301 /blogs/; }

    # --- WordPress leftovers ----------------------------------------------
    location ^~ /wp-admin        { return 410; }
    location ^~ /wp-login.php    { return 410; }
    location ^~ /wp-json         { return 410; }
    location ^~ /wp-content      { return 410; }
    location ^~ /wp-includes     { return 410; }
    location = /xmlrpc.php       { return 410; }

    # Yoast emitted several sitemaps; the export ships one.
    location ~ ^/(post|page|portfolio-item|category|portfolio-category|portfolio-tag|testimonials-category)-sitemap\.xml$ {
      return 301 /sitemap.xml;
    }
    location = /sitemap_index.xml { return 301 /sitemap.xml; }

    # --- trailing slash ----------------------------------------------------
    # The export writes /about-me/index.html. Redirect the slashless form once,
    # permanently, so there is a single canonical URL per page.
    location ~ ^(/.*[^/])$ {
      if (-d $document_root$1) { return 301 $1/; }
      try_files $uri $uri.html $uri/index.html =404;
    }

    location / {
      try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
