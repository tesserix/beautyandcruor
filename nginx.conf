# Serves the Next.js static export. Mirrors the old WordPress URL shape exactly:
# every page is a directory with a trailing slash.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Writable paths, so the container can run read-only and non-root.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml application/rss+xml;
  # AVIF, WebP, JPEG and PNG are already compressed — gzipping them wastes CPU.

  # First line of defence in front of the enquiry sidecar. The service keeps
  # its own per-address ceiling as well — this one is about protecting the pod
  # from volume, that one is about what a person plausibly sends.
  limit_req_zone $binary_remote_addr zone=enquiry:1m rate=6r/m;
  # The editor is chattier than a contact form — a page load, a read and a save
  # are three requests — so it gets its own budget rather than sharing one
  # sized for "how often does a person send an enquiry". The service enforces
  # its own ceiling on sign-in attempts, which is the part that matters.
  limit_req_zone $binary_remote_addr zone=admin:1m rate=30r/m;
  limit_req_status 429;

  # --- indexing -----------------------------------------------------------
  # Only the production domain may be indexed. Every other name this container
  # answers to — the staging host, a port-forward, a preview — gets noindex.
  #
  # It has to be decided per request rather than per build. `output: 'export'`
  # freezes SITE.url into the markup, so the staging host already publishes
  # canonicals, a sitemap and a robots.txt that all name beautyandcruor.com —
  # the WordPress site. Left alone, a crawler indexes staging and credits it to
  # a site we do not control.
  #
  # Keyed on $host so the cutover needs no rebuild and no follow-up edit: the
  # same image stops sending the header the moment it answers on the real name.
  #
  # Deliberately NOT `Disallow: /` in robots.txt. A disallowed URL is never
  # fetched, so the noindex is never read, and it can still be indexed from an
  # external link. Letting the crawler in to be told "noindex" is the only
  # instruction that actually removes a page.
  #
  # An empty map value means add_header emits nothing at all.
  map $host $robots_tag {
    default                 "noindex, nofollow";
    beautyandcruor.com      "";
    www.beautyandcruor.com  "";
  }

  # --- caching ------------------------------------------------------------
  # Cache-Control is computed here rather than overridden inside locations.
  #
  # add_header does not append: a location carrying one of its own inherits
  # NONE of the server-level headers. Overriding Cache-Control per location
  # was therefore silently dropping nosniff, X-Frame-Options, HSTS and the
  # rest from those responses — and would now drop X-Robots-Tag with them.
  #
  # So the path rules live in a map, chained into the content-type map below,
  # and no location needs an add_header at all.
  map $uri $cache_class {
    default                                               "";
    ~^/_next/static/                                      hashed;
    ~^/(favicon\.ico|icon\.png|apple-icon\.png|og\.jpg)$  stable-path;
    /api/enquiry                                          never;
    ~^/admin                                              never;
  }

  map $cache_class:$sent_http_content_type $cache_control {
    default                      "public, max-age=0, must-revalidate";

    # Hashed build assets never change under the same name.
    ~^hashed:                    "public, max-age=31536000, immutable";

    # These four have a fixed path and changing bytes. The content-type rules
    # below would mark them immutable for a year, so a regenerated favicon or
    # OG card would sit pinned in every intermediary cache. Next links the
    # icons with a content hash, so a browser reading the markup always gets
    # the current one — but bookmarks, crawlers and social scrapers fetch them
    # bare, and those are exactly the callers that must not be served last
    # month's mark.
    ~^stable-path:               "public, max-age=86400, must-revalidate";

    # A form post is never cacheable, and the default above would call it
    # must-revalidate rather than no-store.
    ~^never:                     "no-store";

    ~^:image/                    "public, max-age=31536000, immutable";
    ~^:font/                     "public, max-age=31536000, immutable";
    ~^:application/javascript    "public, max-age=31536000, immutable";
    ~^:text/css                  "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;

    # --- assets at a stable path -------------------------------------------
    # Cache-Control for these comes from the $cache_class map; all this
    # location does is refuse to fall through to the catch-all when one is
    # missing. See the map for why they are not immutable.
    location ~ ^/(favicon\.ico|icon\.png|apple-icon\.png|og\.jpg)$ {
      try_files $uri =404;
    }

    # --- the enquiry sidecar -----------------------------------------------
    # Same origin as the site, so the browser needs no CORS and the service
    # needs no public address: it listens on loopback inside this pod, and
    # nothing outside can reach it.
    location = /api/enquiry {
      limit_req zone=enquiry burst=3 nodelay;

      proxy_pass http://127.0.0.1:8081/enquiry;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # The service rate-limits per sender, so it needs to know who that is.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      client_max_body_size 32k;
      proxy_read_timeout 20s;
    }

    # --- the credits editor -------------------------------------------------
    # Served by the sidecar, not from the export: a static admin page would ship
    # its markup to every visitor and count against the client JS budget. Here,
    # the password gate covers the page itself.
    #
    # No auth in nginx. The session cookie is signed by the service and checked
    # there, so this is a route and nothing more — two places deciding who is
    # allowed in is two places to get it wrong.
    #
    # `^~`, not a plain prefix. A regex location is matched BEFORE a prefix one,
    # and the trailing-slash rule below is a regex that /admin matches, so a
    # plain `location /admin` never ran: nginx answered from the export and
    # returned the site's own 404. `^~` stops the regex search on a match.
    location ^~ /admin {
      limit_req zone=admin burst=10 nodelay;

      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      client_max_body_size 512k;
      proxy_read_timeout 30s;
    }

    # Hashed build assets. Immutable via the map; the =404 keeps a missing one
    # from falling through to the catch-all and being answered with HTML.
    # `^~` for the same reason as /admin — as a plain prefix this location was
    # never reached, because the trailing-slash regex below claimed it first.
    location ^~ /_next/static/ {
      try_files $uri =404;
    }

    # --- gone, not missing -------------------------------------------------
    # Empty pages on the old site, plus the Curly demo Portfolio CPT (16 items
    # that referenced only logo and chrome, no work of their own). 410 tells
    # search engines the removal is permanent; they de-index faster than a 404.
    location = /paritivity/            { return 410; }
    location = /location-contact-us/   { return 410; }
    location = /main-home/             { return 410; }
    location ^~ /portfolio-item/       { return 410; }
    location ^~ /portfolio-category/   { return 410; }
    location ^~ /portfolio-tag/        { return 410; }
    location ^~ /testimonials-category/ { return 410; }

    # /beauty-cruor/ was never a separate page — it is the homepage's own slug.
    location = /beauty-cruor/ { return 301 /; }


    # --- old post permalinks ------------------------------------------------
    # WordPress used root-level %postname% permalinks. The rebuild nests posts
    # under /blogs/ for a cleaner namespace, so the originals redirect rather
    # than 404 — they carry whatever link equity the posts have. Generated
    # from src/content/posts; regenerate if a slug changes.
    location = /3d-printing-the-revolutionary-technology-shaping-art-film-and-medicine/ { return 301 /blogs/3d-printing-the-revolutionary-technology-shaping-art-film-and-medicine/; }
    location = /bridging-the-gap-sfx-and-makeup-prosthetics-in-the-indian-film-industry/ { return 301 /blogs/bridging-the-gap-sfx-and-makeup-prosthetics-in-the-indian-film-industry/; }

    # Category archives are not rebuilt; the journal index is the nearest
    # equivalent, so send readers there instead of a dead end.
    location ^~ /category/ { return 301 /blogs/; }
    location ^~ /tag/      { return 301 /blogs/; }
    location ^~ /author/   { return 301 /blogs/; }

    # --- WordPress leftovers ----------------------------------------------
    location ^~ /wp-admin        { return 410; }
    location ^~ /wp-login.php    { return 410; }
    location ^~ /wp-json         { return 410; }
    location ^~ /wp-content      { return 410; }
    location ^~ /wp-includes     { return 410; }
    location = /xmlrpc.php       { return 410; }

    # Yoast emitted several sitemaps; the export ships one.
    location ~ ^/(post|page|portfolio-item|category|portfolio-category|portfolio-tag|testimonials-category)-sitemap\.xml$ {
      return 301 /sitemap.xml;
    }
    location = /sitemap_index.xml { return 301 /sitemap.xml; }

    # --- trailing slash ----------------------------------------------------
    # The export writes /about-me/index.html. Redirect the slashless form once,
    # permanently, so there is a single canonical URL per page.
    location ~ ^(/.*[^/])$ {
      if (-d $document_root$1) { return 301 $1/; }
      try_files $uri $uri.html $uri/index.html =404;
    }

    location / {
      try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /healthz {
      access_log off;
      # default_type, not add_header: an add_header here would drop every
      # inherited security header from the response.
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
