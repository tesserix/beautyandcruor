# Serves the Next.js static export. Mirrors the old WordPress URL shape exactly:
# every page is a directory with a trailing slash.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Writable paths, so the container can run read-only and non-root.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml application/rss+xml;
  # AVIF, WebP, JPEG and PNG are already compressed — gzipping them wastes CPU.

  map $sent_http_content_type $cache_control {
    default                           "public, max-age=0, must-revalidate";
    ~image/                           "public, max-age=31536000, immutable";
    ~font/                            "public, max-age=31536000, immutable";
    "application/javascript"          "public, max-age=31536000, immutable";
    "text/css"                        "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;

    # Hashed build assets never change under the same name.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # --- gone, not missing -------------------------------------------------
    # Empty pages on the old site, plus the Curly demo Portfolio CPT (16 items
    # that referenced only logo and chrome, no work of their own). 410 tells
    # search engines the removal is permanent; they de-index faster than a 404.
    location = /paritivity/            { return 410; }
    location = /location-contact-us/   { return 410; }
    location = /main-home/             { return 410; }
    location ^~ /portfolio-item/       { return 410; }
    location ^~ /portfolio-category/   { return 410; }
    location ^~ /portfolio-tag/        { return 410; }
    location ^~ /testimonials-category/ { return 410; }

    # /beauty-cruor/ was never a separate page — it is the homepage's own slug.
    location = /beauty-cruor/ { return 301 /; }

    # --- WordPress leftovers ----------------------------------------------
    location ^~ /wp-admin        { return 410; }
    location ^~ /wp-login.php    { return 410; }
    location ^~ /wp-json         { return 410; }
    location ^~ /wp-content      { return 410; }
    location ^~ /wp-includes     { return 410; }
    location = /xmlrpc.php       { return 410; }

    # Yoast emitted several sitemaps; the export ships one.
    location ~ ^/(post|page|portfolio-item|category|portfolio-category|portfolio-tag|testimonials-category)-sitemap\.xml$ {
      return 301 /sitemap.xml;
    }
    location = /sitemap_index.xml { return 301 /sitemap.xml; }

    # --- trailing slash ----------------------------------------------------
    # The export writes /about-me/index.html. Redirect the slashless form once,
    # permanently, so there is a single canonical URL per page.
    location ~ ^(/.*[^/])$ {
      if (-d $document_root$1) { return 301 $1/; }
      try_files $uri $uri.html $uri/index.html =404;
    }

    location / {
      try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
