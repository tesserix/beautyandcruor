name: CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'bugfix/**', 'hotfix/**']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'capture/live-images.json'
      - 'nginx.conf'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_NAME: beautyandcruor

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      # write, so the build can fast-forward `deploy` once both images are
      # pushed — Kargo watches that branch rather than main.
      #
      # This block is the one that counts. A job-level `permissions` replaces
      # the workflow-level one outright rather than merging with it, so
      # granting contents: write at the top while this said read left the
      # token read-only and the push failed with a 403 that named
      # github-actions[bot] and looked like a repository setting.
      contents: write
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No NODE_AUTH_TOKEN: this app has no @tesserix/* dependencies, so there
      # is nothing to authenticate against GitHub Packages for.
      - name: Install dependencies
        run: npm ci

      # `npm run lint` is NOT run. eslint fails at config load on this repo
      # with a circular-reference error in eslint-config-next, reproducible on
      # a clean checkout and unrelated to any source file — it would fail every
      # build for a reason no PR can fix. Typecheck covers the same ground for
      # a TypeScript codebase.
      # Pinned rather than left to the runner's default: go.mod asks for 1.25
      # and a runner image bump should not silently change the toolchain that
      # gates the spam rules.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: enquiry/go.mod
          cache-dependency-path: enquiry/go.sum

      - name: Test the enquiry sidecar
        run: |
          cd enquiry
          go vet ./...
          go test ./...

      - name: Typecheck
        run: npm run typecheck

      # The rights gate. Refuses any image the live WordPress site never
      # published and that nobody has explicitly cleared — see
      # scripts/assets-sync.mjs and docs/OPEN-QUESTIONS.md Q7/Q8. It reads the
      # committed manifest, the live-site record and the allowlist, so it runs
      # here without needing the image files themselves. Reported sizes are 0
      # because public/img is absent; the vetting is what matters.
      - name: Verify no unpublished images are referenced
        run: npm run assets

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          ENQUIRY_IMAGE="${FULL_IMAGE}-enquiry"
          # The tag has to say which branch it came from.
          #
          # This was `main-<sha7>` for every ref, so a push to feat/** or
          # hotfix/** published an image tagged as if it were main. That was
          # harmless while a human bumped the tag by hand and read the sha.
          # It stopped being harmless the moment Kargo started promoting
          # automatically: its warehouse selects the newest build matching
          # `^main-[a-f0-9]{7,12}$`, so an unmerged branch build could be
          # picked up and deployed to production.
          #
          # Branch names carry slashes, which a Docker tag cannot, so they
          # are flattened to hyphens. The result cannot collide with the
          # main- form because a sha7 is hex and a branch prefix is not.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            BUILD_TAG="main-${GITHUB_SHA::7}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            SLUG="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
            BUILD_TAG="${SLUG}-${GITHUB_SHA::7}"
          fi
          echo "Building ${BUILD_TAG} from ${GITHUB_REF}"
          echo "tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "build_image=${FULL_IMAGE}:${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "enquiry_image=${ENQUIRY_IMAGE}:${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "enquiry_repo=${ENQUIRY_IMAGE}" >> $GITHUB_OUTPUT

      # OPENPANEL_CLIENT_ID is a repository *variable*, not a secret: it
      # identifies the project to a script running in the browser, so it is
      # public by construction. It has to be here rather than mounted at
      # runtime because this is a static export — there is no server to read
      # config. Unset, the analytics component renders nothing.
      #
      # ASSET_BASE_URL is not passed: the Dockerfile's default is the bucket's
      # native URL (D16). Override it here only when the custom asset host is
      # live, and remember it is frozen into the HTML at build time.
      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          docker build --platform linux/amd64 \
            --build-arg OPENPANEL_CLIENT_ID="${{ vars.OPENPANEL_CLIENT_ID }}" \
            -t ${{ steps.meta.outputs.build_image }} \
            .
          docker push ${{ steps.meta.outputs.build_image }}
          # `latest` only ever means main. A branch build moving it pointed
          # the floating tag at unmerged code.
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            docker tag ${{ steps.meta.outputs.build_image }} ${{ steps.meta.outputs.full_image }}:latest
            docker push ${{ steps.meta.outputs.full_image }}:latest
          fi

      # The enquiry sidecar. A separate image because it is a separate process
      # — the site container is nginx serving files and nothing else. Its
      # Dockerfile runs `go test` before it builds, so a spam rule that stops
      # working fails the push rather than shipping.
      - name: Build and push the enquiry sidecar
        if: github.event_name != 'pull_request'
        run: |
          docker build --platform linux/amd64 \
            -t ${{ steps.meta.outputs.enquiry_image }} \
            ./enquiry
          docker push ${{ steps.meta.outputs.enquiry_image }}
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            docker tag ${{ steps.meta.outputs.enquiry_image }} ${{ steps.meta.outputs.enquiry_repo }}:latest
            docker push ${{ steps.meta.outputs.enquiry_repo }}:latest
          fi

      # `latest` is pushed from main only, and nothing reads it: the chart
      # pins main-<sha7> and Kargo rewrites that on promotion. It is kept for
      # ad-hoc `docker run` against the current main and for nothing else.

      # Kargo promotes from this branch, never from main.
      #
      # It derives the image tag from the commit it finds — main-<sha7> — so a
      # commit must not become visible to Kargo until both images carrying
      # that tag exist. Watching main directly races the build: Kargo polls
      # every 300s, the push takes two to three minutes, and a promotion in
      # that window deploys a tag the registry does not have yet. The GAR
      # pull-through mirror then negative-caches the 404 and the pods sit in
      # ImagePullBackOff that does not recover on its own — devai hit exactly
      # this and moved to a deploy branch for the same reason.
      #
      # It also solves the path filter. This workflow only runs when src/,
      # scripts/, public/, nginx.conf, the Dockerfile or the manifests change,
      # so a docs-only commit builds nothing and has no image. Such a commit
      # never advances `deploy`, so Kargo never tries to deploy it.
      #
      # Fast-forward only. `deploy` tracks main and nothing else writes to it,
      # so a rejected push means something unexpected happened and the build
      # should say so rather than force past it.
      - name: Advance the deploy branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "advancing deploy to ${GITHUB_SHA}"
          git push origin "${GITHUB_SHA}:refs/heads/deploy"

      - name: Security scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.build_image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy scan results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Tag** | \`${{ steps.meta.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Image** | \`${{ steps.meta.outputs.build_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "- Typecheck and rights gate passed (PR mode — build and push skipped)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Typecheck" >> $GITHUB_STEP_SUMMARY
            echo "- Rights gate: no unpublished images referenced" >> $GITHUB_STEP_SUMMARY
            echo "- Docker build → \`${{ steps.meta.outputs.build_image }}\` (+ \`:latest\`)" >> $GITHUB_STEP_SUMMARY
            echo "- Pushed to GHCR; Artifact Registry mirrors it at asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/" >> $GITHUB_STEP_SUMMARY
            echo "- Trivy security scan" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Images are NOT built here. \`public/img\` is gitignored and dockerignored;" >> $GITHUB_STEP_SUMMARY
          echo "> the site is built from the committed manifest and serves derivatives from GCS." >> $GITHUB_STEP_SUMMARY
          echo "> Run \`npm run images && npm run assets:upload\` locally, then commit the manifest." >> $GITHUB_STEP_SUMMARY
